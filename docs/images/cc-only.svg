<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hccp" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#581c87"/><stop offset="100%" stop-color="#c026d3"/></linearGradient>
  </defs>
  <rect width="840" height="560" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="840" height="48" fill="url(#hccp)" rx="8"/><rect x="0" y="40" width="840" height="8" fill="url(#hccp)"/>
  <text x="420" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">The Reverse View — What Claude Code Has that Codex Doesn't (or does narrower)</text>

  <!-- column heads -->
  <text x="250" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#a21caf">CLAUDE CODE</text>
  <text x="640" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#475569">CODEX status</text>
  <line x1="445" y1="84" x2="445" y2="430" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <g font-size="10.5">
    <!-- 1 -->
    <text x="430" y="100" text-anchor="middle" fill="#64748b" font-weight="600">repurpose the agent</text>
    <rect x="40" y="108" width="380" height="30" rx="5" fill="#fae8ff" stroke="#c026d3"/><text x="56" y="127">Output Styles — rewrite whole system prompt (Learning, custom)</text>
    <rect x="450" y="108" width="350" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="466" y="127">only `personality` (tone) — narrower</text>

    <!-- 2 -->
    <text x="430" y="156" text-anchor="middle" fill="#64748b" font-weight="600">thinking budget</text>
    <rect x="40" y="164" width="380" height="30" rx="5" fill="#fae8ff" stroke="#c026d3"/><text x="56" y="183">prose triggers: "think" → "think harder" → "ultrathink"</text>
    <rect x="450" y="164" width="350" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="466" y="183">discrete ReasoningEffort enum, no prose scaling</text>

    <!-- 3 -->
    <text x="430" y="212" text-anchor="middle" fill="#64748b" font-weight="600">define a sub-agent</text>
    <rect x="40" y="220" width="380" height="30" rx="5" fill="#fae8ff" stroke="#c026d3"/><text x="56" y="239">.claude/agents/*.md — declarative, auto-delegated by description</text>
    <rect x="450" y="220" width="350" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="466" y="239">built-in roles + graph/identity; no drop-in md agents</text>

    <!-- 4 -->
    <text x="430" y="268" text-anchor="middle" fill="#64748b" font-weight="600">memory authoring</text>
    <rect x="40" y="276" width="380" height="30" rx="5" fill="#fae8ff" stroke="#c026d3"/><text x="56" y="295">`#` quick-add to memory · CLAUDE.md `@path` imports</text>
    <rect x="450" y="276" width="350" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="466" y="295">AGENTS.md + @-mentions; no import directive / quick-add</text>

    <!-- 5 -->
    <text x="430" y="324" text-anchor="middle" fill="#64748b" font-weight="600">config &amp; permissions</text>
    <rect x="40" y="332" width="380" height="30" rx="5" fill="#fae8ff" stroke="#c026d3"/><text x="56" y="351">layered settings.json + allow/deny/ask rule matchers + managed</text>
    <rect x="450" y="332" width="350" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="466" y="351">config.toml + profiles + execpolicy — different shape</text>

    <!-- 6 -->
    <text x="430" y="380" text-anchor="middle" fill="#64748b" font-weight="600">hook event catalog</text>
    <rect x="40" y="388" width="380" height="30" rx="5" fill="#fdf4ff" stroke="#d8b4fe"/><text x="56" y="407">broad named events (UserPromptSubmit, PreCompact, Stop…)</text>
    <rect x="450" y="388" width="350" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="466" y="407">has hooks too — different/leaner catalog (🟡)</text>
  </g>

  <!-- converged band -->
  <text x="40" y="448" font-size="11" font-weight="700" fill="#15803d">CHECKED &amp; FOUND IN CODEX — so NOT Claude-Code-only:</text>
  <rect x="40" y="456" width="760" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="420" y="476" font-size="10.5" text-anchor="middle" fill="#166534">Plan mode ✔ · background tasks ✔ · personalities ✔ · slash commands ✔ · conversation backtrack/checkpoint ✔</text>
  <text x="420" y="494" font-size="10.5" text-anchor="middle" fill="#166534">skills ✔ · MCP client+server ✔ · hooks ✔ · web search ✔ · AGENTS.md ✔ · compaction ✔ · multi-agent ✔</text>

  <rect x="40" y="516" width="760" height="32" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="420" y="536" font-size="10.5" text-anchor="middle" fill="#475569">Epistemics: Codex rows verified by grepping its open source; Claude Code rows from documented behavior (closed source). The gap is mostly authoring ergonomics + the thinking-budget interface, not missing capability.</text>
</svg>
