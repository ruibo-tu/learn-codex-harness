<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="860" height="520" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="860" height="48" fill="url(#hdr2)" rx="8"/>
  <rect x="0" y="40" width="860" height="8" fill="url(#hdr2)"/>
  <text x="430" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">The Deepest Divergence — Who is the Default Safety Net?</text>

  <!-- model wants to run a command -->
  <rect x="330" y="70" width="200" height="42" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="430" y="96" font-size="12" text-anchor="middle" font-weight="600">model wants to run a command</text>

  <!-- LEFT: Codex sandbox-first -->
  <rect x="30" y="140" width="380" height="330" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="166" font-size="14" text-anchor="middle" font-weight="700" fill="#b45309">CODEX — sandbox-first 🔴</text>

  <rect x="120" y="186" width="200" height="38" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="220" y="210" font-size="11.5" text-anchor="middle">run INSIDE kernel sandbox</text>
  <text x="220" y="244" font-size="10.5" text-anchor="middle" fill="#92400e">Seatbelt · Landlock · bwrap · network OFF</text>

  <rect x="120" y="262" width="200" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="220" y="285" font-size="11.5" text-anchor="middle" fill="#166534">stayed in bounds → DONE</text>

  <rect x="120" y="320" width="200" height="36" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="220" y="343" font-size="11.5" text-anchor="middle" fill="#991b1b">tried to escape → ESCALATE</text>

  <rect x="86" y="384" width="120" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="146" y="408" font-size="11" text-anchor="middle">ask a human</text>
  <text x="146" y="426" font-size="10.5" text-anchor="middle" fill="#6d28d9">(the exception)</text>
  <rect x="232" y="384" width="120" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="292" y="402" font-size="10.5" text-anchor="middle">or guardian</text>
  <text x="292" y="418" font-size="10.5" text-anchor="middle">AI reviewer</text>
  <text x="292" y="434" font-size="9.5" text-anchor="middle" fill="#6d28d9">(auto_review) 🔴</text>

  <line x1="220" y1="224" x2="220" y2="260" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="220" y1="298" x2="220" y2="318" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <line x1="180" y1="356" x2="155" y2="382" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="260" y1="356" x2="285" y2="382" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RIGHT: Claude Code approval-first -->
  <rect x="450" y="140" width="380" height="330" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="640" y="166" font-size="14" text-anchor="middle" font-weight="700" fill="#475569">CLAUDE CODE — approval-first</text>

  <rect x="540" y="186" width="200" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="640" y="210" font-size="11.5" text-anchor="middle">match allowlist / hook rule?</text>

  <rect x="470" y="262" width="150" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="545" y="285" font-size="11" text-anchor="middle" fill="#166534">on allowlist → run</text>

  <rect x="660" y="262" width="150" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="735" y="285" font-size="11" text-anchor="middle">else → ask FIRST</text>

  <rect x="540" y="340" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="640" y="362" font-size="10.5" text-anchor="middle">human is in the loop BY DEFAULT;</text>
  <text x="640" y="378" font-size="10.5" text-anchor="middle">sandbox is a lighter, optional layer</text>

  <line x1="600" y1="224" x2="560" y2="260" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="680" y1="224" x2="720" y2="260" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="640" y1="298" x2="640" y2="338" stroke="#555" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <line x1="380" y1="112" x2="240" y2="184" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="112" x2="620" y2="184" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bottom takeaway -->
  <rect x="30" y="482" width="800" height="30" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="430" y="501" font-size="11.5" text-anchor="middle" fill="#334155">Takeaway: Codex trusts the <tspan font-weight="700">kernel</tspan> and treats the human as the exception; Claude Code trusts the <tspan font-weight="700">human</tspan> and treats the sandbox as an add-on.</text>
</svg>
