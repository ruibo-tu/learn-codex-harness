<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b3d2e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="860" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="860" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="860" height="8" fill="url(#header)"/>
  <text x="430" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Codex — One Loop, Many Wrappers (the spine the whole course points at)</text>

  <!-- Surfaces -->
  <text x="40" y="78" fill="#64748b" font-size="11" font-weight="700">SURFACES (write SQ / read EQ)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="86" width="86" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="83" y="105">TUI</text>
    <rect x="134" y="86" width="86" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="177" y="105">exec / CI</text>
    <rect x="228" y="86" width="86" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="271" y="105">SDK</text>
    <rect x="322" y="86" width="120" height="30" rx="6" fill="#fde68a" stroke="#d97706"/><text x="382" y="105">voice / cloud 🔴</text>
  </g>

  <!-- SQ / EQ -->
  <rect x="40" y="140" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="125" y="165" font-size="12" text-anchor="middle" font-weight="600">Submission Queue</text>
  <rect x="620" y="140" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="705" y="165" font-size="12" text-anchor="middle" font-weight="600">Event Queue</text>

  <!-- The loop -->
  <rect x="300" y="130" width="240" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="420" y="158" font-size="14" text-anchor="middle" font-weight="700" fill="#15803d">THE LOOP</text>
  <text x="420" y="180" font-size="11" text-anchor="middle" fill="#166534">Session · Thread · Turn</text>
  <text x="420" y="198" font-size="11" text-anchor="middle" fill="#166534">model → tools → repeat</text>
  <text x="420" y="222" font-size="10" text-anchor="middle" fill="#16a34a" font-style="italic">🟢 ~same as Claude Code</text>
  <text x="420" y="238" font-size="10" text-anchor="middle" fill="#16a34a" font-style="italic">nothing below rewrites it</text>

  <line x1="210" y1="160" x2="298" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="170" x2="618" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="116" x2="160" y2="138" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="700" y1="138" x2="380" y2="118" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Wrappers -->
  <text x="40" y="300" fill="#64748b" font-size="11" font-weight="700">WRAPPERS (each lesson adds one — never edits the loop)</text>
  <g font-size="10.5" text-anchor="middle">
    <!-- divergent (amber) -->
    <rect x="40"  y="312" width="130" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="105" y="333">sandbox-first 🔴</text>
    <rect x="178" y="312" width="130" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="243" y="333">apply_patch 🔴</text>
    <rect x="316" y="312" width="130" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="381" y="333">code mode 🔴</text>
    <rect x="454" y="312" width="150" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="529" y="333">guardian review 🔴</text>
    <rect x="612" y="312" width="178" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="701" y="333">Responses API + providers 🔴</text>
    <!-- shared (gray) -->
    <rect x="40"  y="356" width="118" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="99" y="377">tools 🟢</text>
    <rect x="166" y="356" width="118" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="225" y="377">context/compact 🟢</text>
    <rect x="292" y="356" width="90" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="337" y="377">MCP 🟢</text>
    <rect x="390" y="356" width="90" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="435" y="377">hooks 🟡</text>
    <rect x="488" y="356" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="548" y="377">multi-agent 🟡</text>
    <rect x="616" y="356" width="174" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="703" y="377">rollout / AGENTS.md 🟡🟢</text>
  </g>

  <!-- legend -->
  <text x="40" y="430" font-size="11" font-weight="700" fill="#334155">Legend</text>
  <rect x="40" y="438" width="16" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="62" y="450" font-size="11">🔴 Divergent from Claude Code — focus here</text>
  <rect x="370" y="438" width="16" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><text x="392" y="450" font-size="11">🟡 twisted   🟢 same — skim</text>
</svg>
