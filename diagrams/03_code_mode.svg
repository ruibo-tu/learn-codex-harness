<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hdr4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="860" height="460" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="860" height="48" fill="url(#hdr4)" rx="8"/>
  <rect x="0" y="40" width="860" height="8" fill="url(#hdr4)"/>
  <text x="430" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Code Mode 🔴 — the Model Writes a Program that Calls Tools</text>

  <!-- Claude Code: JSON ping-pong -->
  <rect x="30" y="68" width="370" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="215" y="92" font-size="13" text-anchor="middle" font-weight="700" fill="#475569">Claude Code — JSON function-calls</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="60" y="110" width="120" height="28" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="120" y="128">model: call A</text>
    <rect x="250" y="110" width="120" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="310" y="128">result A</text>
    <rect x="60" y="170" width="120" height="28" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="120" y="188">model: call B</text>
    <rect x="250" y="170" width="120" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="310" y="188">result B</text>
    <rect x="60" y="230" width="120" height="28" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="120" y="248">model: call C</text>
    <rect x="250" y="230" width="120" height="28" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="310" y="248">result C</text>
  </g>
  <line x1="180" y1="124" x2="248" y2="124" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="250" y1="138" x2="182" y2="168" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="180" y1="184" x2="248" y2="184" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="250" y1="198" x2="182" y2="228" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="180" y1="244" x2="248" y2="244" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="215" y="300" font-size="11" text-anchor="middle" fill="#475569">N tool calls = N model round-trips</text>
  <text x="215" y="322" font-size="11" text-anchor="middle" fill="#475569">simple, robust, but chatty for loops</text>
  <text x="215" y="392" font-size="11" text-anchor="middle" fill="#64748b" font-style="italic">no loops/branches between calls —</text>
  <text x="215" y="408" font-size="11" text-anchor="middle" fill="#64748b" font-style="italic">the harness drives the iteration</text>

  <!-- Codex: code mode -->
  <rect x="440" y="68" width="390" height="360" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="635" y="92" font-size="13" text-anchor="middle" font-weight="700" fill="#7e22ce">Codex — code mode</text>

  <text x="460" y="112" font-size="10.5" fill="#7e22ce">1. tools rendered as a typed API:</text>
  <rect x="460" y="118" width="350" height="40" rx="6" fill="#0f172a"/>
  <text x="472" y="135" font-size="10" fill="#c4b5fd" font-family="monospace">declare function read_file(path: string): string;</text>
  <text x="472" y="150" font-size="10" fill="#c4b5fd" font-family="monospace">declare function write_file(path, contents): void;</text>

  <text x="460" y="180" font-size="10.5" fill="#7e22ce">2. the model's ONE response is a program:</text>
  <rect x="460" y="186" width="350" height="86" rx="6" fill="#0f172a"/>
  <text x="472" y="206" font-size="10.5" fill="#fde68a" font-family="monospace">for p in list_dir("src/"):</text>
  <text x="472" y="222" font-size="10.5" fill="#e2e8f0" font-family="monospace">    body = read_file(p)</text>
  <text x="472" y="238" font-size="10.5" fill="#e2e8f0" font-family="monospace">    write_file(p, "# audited\n" + body)</text>
  <text x="472" y="260" font-size="10" fill="#94a3b8" font-family="monospace">// loops + branches, all in one turn</text>

  <text x="460" y="294" font-size="10.5" fill="#7e22ce">3. each call = a nested tool call event:</text>
  <g font-size="9.5" text-anchor="middle" fill="#581c87">
    <rect x="460" y="300" width="86" height="24" rx="5" fill="#ede9fe" stroke="#9333ea"/><text x="503" y="316">list_dir</text>
    <rect x="552" y="300" width="86" height="24" rx="5" fill="#ede9fe" stroke="#9333ea"/><text x="595" y="316">read_file</text>
    <rect x="644" y="300" width="86" height="24" rx="5" fill="#ede9fe" stroke="#9333ea"/><text x="687" y="316">write_file</text>
    <rect x="736" y="300" width="74" height="24" rx="5" fill="#ede9fe" stroke="#9333ea"/><text x="773" y="316">…×N</text>
  </g>
  <text x="635" y="352" font-size="11" text-anchor="middle" fill="#7e22ce" font-weight="600">N tool calls in ONE model turn</text>
  <text x="635" y="374" font-size="10.5" text-anchor="middle" fill="#7e22ce">cost: a sandboxed code runtime + nested-call protocol</text>
  <text x="635" y="396" font-size="10.5" text-anchor="middle" fill="#7e22ce">(code-mode-protocol crate; no Claude Code analogue)</text>

  <text x="430" y="446" font-size="11" text-anchor="middle" fill="#334155">Run <tspan font-family="monospace">examples/04_code_mode.py</tspan> to render the API and execute a code-mode script.</text>
</svg>
