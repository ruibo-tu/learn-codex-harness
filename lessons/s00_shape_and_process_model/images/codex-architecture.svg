<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <linearGradient id="hca" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0b3d2e"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
  </defs>
  <rect width="920" height="660" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="920" height="46" fill="url(#hca)" rx="8"/><rect x="0" y="38" width="920" height="8" fill="url(#hca)"/>
  <text x="460" y="29" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Codex — Architecture Overview (crates &amp; data flow)</text>

  <!-- SURFACES -->
  <text x="40" y="72" fill="#6366f1" font-size="11" font-weight="700">SURFACES — each only writes SQ / reads EQ</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="40"  y="80" width="120" height="38" rx="7" fill="#eef2ff" stroke="#6366f1"/><text x="100" y="98">TUI</text><text x="100" y="112" font-size="9" fill="#64748b">tui · ratatui</text>
    <rect x="172" y="80" width="120" height="38" rx="7" fill="#eef2ff" stroke="#6366f1"/><text x="232" y="98">exec (CI)</text><text x="232" y="112" font-size="9" fill="#64748b">exec · JSONL</text>
    <rect x="304" y="80" width="150" height="38" rx="7" fill="#eef2ff" stroke="#6366f1"/><text x="379" y="98">app-server → SDKs</text><text x="379" y="112" font-size="9" fill="#64748b">TS · Python</text>
    <rect x="466" y="80" width="130" height="38" rx="7" fill="#fde68a" stroke="#d97706"/><text x="531" y="98">realtime voice</text><text x="531" y="112" font-size="9" fill="#92400e">realtime-webrtc</text>
    <rect x="608" y="80" width="120" height="38" rx="7" fill="#fde68a" stroke="#d97706"/><text x="668" y="98">cloud-tasks</text><text x="668" y="112" font-size="9" fill="#92400e">cloud client</text>
    <rect x="740" y="80" width="140" height="38" rx="7" fill="#f1f5f9" stroke="#94a3b8"/><text x="810" y="97">codex-cli (Node)</text><text x="810" y="111" font-size="9" fill="#64748b">thin launcher → binary</text>
  </g>

  <!-- protocol bus -->
  <rect x="40" y="132" width="840" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="460" y="151" font-size="11.5" text-anchor="middle" font-weight="700" fill="#075985">▼ Submission Queue   /   Event Queue ▲   —   protocol · app-server-protocol</text>
  <line x1="232" y1="118" x2="232" y2="131" stroke="#64748b" stroke-width="1.2" marker-end="url(#ad)"/>
  <line x1="379" y1="118" x2="379" y2="131" stroke="#64748b" stroke-width="1.2" marker-end="url(#ad)"/>

  <!-- CORE -->
  <rect x="40" y="176" width="840" height="338" rx="12" fill="#f7fdf9" stroke="#16a34a" stroke-width="2"/>
  <text x="56" y="196" fill="#15803d" font-size="12" font-weight="700">codex-core — the brain</text>

  <!-- Model I/O (left) -->
  <rect x="56" y="206" width="244" height="120" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="178" y="225" font-size="11" text-anchor="middle" font-weight="700" fill="#334155">Model I/O</text>
  <text x="70" y="246" font-size="10">client.rs → OpenAI Responses API</text>
  <text x="70" y="265" font-size="10">SSE stream → typed ResponseEvents</text>
  <text x="70" y="284" font-size="10">retry · reasoning · client_common</text>
  <rect x="70" y="294" width="216" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="178" y="310" font-size="9.5" text-anchor="middle" fill="#475569">providers: openai · azure · ollama · lmstudio</text>

  <!-- THE LOOP (center) -->
  <rect x="316" y="206" width="248" height="120" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="226" font-size="12" text-anchor="middle" font-weight="700" fill="#166534">THE LOOP</text>
  <text x="440" y="248" font-size="10.5" text-anchor="middle" fill="#166534">Thread · Session · Turn</text>
  <text x="440" y="266" font-size="10.5" text-anchor="middle" fill="#166534">TurnContext (frozen per turn)</text>
  <text x="440" y="290" font-size="10" text-anchor="middle" fill="#15803d">model → tools → repeat</text>
  <text x="440" y="312" font-size="9.5" text-anchor="middle" fill="#16a34a" font-style="italic">nothing else rewrites this</text>

  <!-- Tools (right) -->
  <rect x="580" y="206" width="284" height="120" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="722" y="225" font-size="11" text-anchor="middle" font-weight="700" fill="#334155">Tools — registry · router</text>
  <g font-size="9" text-anchor="middle" fill="#1e293b">
    <rect x="592" y="234" width="78" height="22" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="631" y="249">shell/exec</text>
    <rect x="676" y="234" width="80" height="22" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="716" y="249">apply_patch</text>
    <rect x="762" y="234" width="92" height="22" rx="5" fill="#fde68a" stroke="#d97706"/><text x="808" y="249">code_mode</text>
    <rect x="592" y="262" width="60" height="22" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="622" y="277">plan</text>
    <rect x="658" y="262" width="58" height="22" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="687" y="277">mcp</text>
    <rect x="722" y="262" width="92" height="22" rx="5" fill="#eef2ff" stroke="#6366f1"/><text x="768" y="277">multi_agents</text>
  </g>
  <text x="722" y="302" font-size="9.5" text-anchor="middle" fill="#475569">orchestrator: bounded parallel calls</text>
  <text x="722" y="317" font-size="9.5" text-anchor="middle" fill="#475569">+ web_search · view_image · request_*</text>

  <line x1="300" y1="266" x2="314" y2="266" stroke="#64748b" stroke-width="1.3" marker-end="url(#ad)"/>
  <line x1="314" y1="276" x2="300" y2="276" stroke="#64748b" stroke-width="1.3" marker-end="url(#ad)"/>
  <line x1="564" y1="266" x2="578" y2="266" stroke="#64748b" stroke-width="1.3" marker-end="url(#ad)"/>
  <line x1="578" y1="276" x2="564" y2="276" stroke="#64748b" stroke-width="1.3" marker-end="url(#ad)"/>

  <!-- Context/memory + extensibility row -->
  <rect x="56" y="336" width="404" height="62" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="258" y="354" font-size="11" text-anchor="middle" font-weight="700" fill="#334155">Context &amp; memory</text>
  <text x="258" y="372" font-size="9.5" text-anchor="middle" fill="#475569">context_manager · token budget · compaction (inline/remote)</text>
  <text x="258" y="388" font-size="9.5" text-anchor="middle" fill="#475569">rollout (append-only log) · thread-store · message-history</text>

  <rect x="472" y="336" width="392" height="62" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="668" y="354" font-size="11" text-anchor="middle" font-weight="700" fill="#334155">Extensibility &amp; knowledge</text>
  <text x="668" y="372" font-size="9.5" text-anchor="middle" fill="#475569">MCP client + server · hooks · plugins · skills</text>
  <text x="668" y="388" font-size="9.5" text-anchor="middle" fill="#475569">AGENTS.md · memories · connectors</text>

  <!-- Safety band -->
  <rect x="56" y="408" width="808" height="92" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="460" y="427" font-size="11.5" text-anchor="middle" font-weight="700" fill="#b45309">Safety &amp; sandbox — every tool that touches the OS passes through here first</text>
  <g font-size="9.5" text-anchor="middle" fill="#7c2d12">
    <rect x="72"  y="436" width="180" height="26" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="162" y="453">safety.rs (allow/sandbox/ask)</text>
    <rect x="264" y="436" width="220" height="26" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="374" y="453">sandboxing: seatbelt · landlock · bwrap · windows</text>
    <rect x="496" y="436" width="150" height="26" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="571" y="453">execpolicy (allow/deny)</text>
    <rect x="658" y="436" width="190" height="26" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="753" y="453">network-proxy (net off by default)</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#7c2d12">
    <rect x="264" y="468" width="220" height="24" rx="6" fill="#fde68a" stroke="#d97706"/><text x="374" y="484">escalate → human  OR  guardian (auto_review)</text>
    <rect x="496" y="468" width="150" height="24" rx="6" fill="#fde68a" stroke="#d97706"/><text x="571" y="484">shell-escalation</text>
  </g>

  <!-- OS resources -->
  <text x="40" y="536" fill="#64748b" font-size="11" font-weight="700">OPERATING SYSTEM — mediated by the sandbox, never touched directly</text>
  <g font-size="10.5" text-anchor="middle" fill="#334155">
    <rect x="40"  y="546" width="260" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="170" y="571">filesystem (workspace-write)</text>
    <rect x="320" y="546" width="260" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="450" y="571">network (off / via proxy)</text>
    <rect x="600" y="546" width="280" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="740" y="571">processes (spawned in sandbox)</text>
  </g>
  <line x1="460" y1="500" x2="460" y2="544" stroke="#d97706" stroke-width="1.4" marker-end="url(#ad)"/>

  <text x="460" y="610" font-size="10" text-anchor="middle" fill="#94a3b8">~97 Rust crates in codex-rs/ · the Node launcher carries no agent logic · amber = the parts that diverge most from Claude Code</text>
  <rect x="40" y="624" width="840" height="24" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="460" y="640" font-size="10" text-anchor="middle" fill="#166534">Read order: surfaces → SQ/EQ → the loop → tools → safety/sandbox → context/rollout → extensibility</text>
</svg>
