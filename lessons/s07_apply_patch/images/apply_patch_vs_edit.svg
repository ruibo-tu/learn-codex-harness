<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hdr3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="860" height="470" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="860" height="48" fill="url(#hdr3)" rx="8"/>
  <rect x="0" y="40" width="860" height="8" fill="url(#hdr3)"/>
  <text x="430" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Editing Files — Patch Grammar (Codex) vs String Replace (Claude Code)</text>

  <!-- Codex side -->
  <rect x="30" y="68" width="390" height="372" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="92" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d4ed8">CODEX · apply_patch 🔴</text>
  <text x="225" y="112" font-size="11" text-anchor="middle" fill="#3b82f6">one blob → many files → context-matched</text>

  <rect x="50" y="124" width="350" height="150" rx="6" fill="#0f172a"/>
  <text x="64" y="144" font-size="11" fill="#e2e8f0" font-family="monospace">*** Begin Patch</text>
  <text x="64" y="160" font-size="11" fill="#86efac" font-family="monospace">*** Add File: greeting.py</text>
  <text x="64" y="176" font-size="11" fill="#86efac" font-family="monospace">+def hi(): return "hi"</text>
  <text x="64" y="192" font-size="11" fill="#93c5fd" font-family="monospace">*** Update File: math.py</text>
  <text x="64" y="208" font-size="11" fill="#cbd5e1" font-family="monospace">@@ def add(a, b):</text>
  <text x="64" y="224" font-size="11" fill="#fca5a5" font-family="monospace">-    return a - b</text>
  <text x="64" y="240" font-size="11" fill="#86efac" font-family="monospace">+    return a + b</text>
  <text x="64" y="256" font-size="11" fill="#e2e8f0" font-family="monospace">*** End Patch</text>

  <g font-size="11" fill="#1e3a8a">
    <text x="50" y="300">✓ atomic multi-file change, one diff to review</text>
    <text x="50" y="322">✓ a real grammar (apply_patch.lark) validates it</text>
    <text x="50" y="344">✓ seek_sequence locates context — no line numbers</text>
    <text x="50" y="366">✓ survives drifted/shifted lines</text>
    <text x="50" y="388" fill="#1d4ed8" font-weight="600">failure mode: context block not found</text>
    <text x="50" y="416" fill="#64748b" font-style="italic">→ structured object BEFORE it touches disk;</text>
    <text x="50" y="430" fill="#64748b" font-style="italic">   diff render &amp; sandbox checks compose on it</text>
  </g>

  <!-- Claude Code side -->
  <rect x="440" y="68" width="390" height="372" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="635" y="92" font-size="13.5" text-anchor="middle" font-weight="700" fill="#475569">CLAUDE CODE · Edit / Write</text>
  <text x="635" y="112" font-size="11" text-anchor="middle" fill="#64748b">find-and-replace a unique string</text>

  <rect x="460" y="124" width="350" height="150" rx="6" fill="#0f172a"/>
  <text x="474" y="150" font-size="11" fill="#e2e8f0" font-family="monospace">Edit(</text>
  <text x="474" y="170" font-size="11" fill="#93c5fd" font-family="monospace">  file = "math.py",</text>
  <text x="474" y="190" font-size="11" fill="#fca5a5" font-family="monospace">  old  = "return a - b",</text>
  <text x="474" y="210" font-size="11" fill="#86efac" font-family="monospace">  new  = "return a + b",</text>
  <text x="474" y="230" font-size="11" fill="#e2e8f0" font-family="monospace">)</text>
  <text x="474" y="258" font-size="10.5" fill="#64748b" font-family="monospace">// one call per edit; Write = whole file</text>

  <g font-size="11" fill="#334155">
    <text x="460" y="300">✓ dead simple — no grammar to learn</text>
    <text x="460" y="322">✓ model just supplies old → new strings</text>
    <text x="460" y="344">✗ ambiguous if the old string isn't unique</text>
    <text x="460" y="366">✗ exact substring — whitespace/indent drift breaks</text>
    <text x="460" y="388" fill="#475569" font-weight="600">failure mode: match not unique / not found</text>
    <text x="460" y="416" fill="#64748b" font-style="italic">→ validated more at APPLY time;</text>
    <text x="460" y="430" fill="#64748b" font-style="italic">   each edit is its own tool call</text>
  </g>

  <text x="430" y="462" font-size="11" text-anchor="middle" fill="#334155">Run <tspan font-family="monospace">lessons/s07_apply_patch/code.py</tspan> to apply the left blob (and see why line numbers didn't matter).</text>
</svg>
